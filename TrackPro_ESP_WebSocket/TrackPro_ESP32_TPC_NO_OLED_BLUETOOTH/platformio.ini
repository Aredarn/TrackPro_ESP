; Bluetooth firmware. Open this folder in VS Code with the PlatformIO extension and
; Build / Upload - the ESP32 board package and libraries download on the first build.
; The sketch stays a plain .ino, so it still opens in Arduino IDE too.

[platformio]
src_dir = .

[env:esp32_bluetooth]
platform = espressif32
board = esp32dev
framework = arduino
; ~2 MB for the app - the Bluetooth Classic stack doesn't fit the default partition
board_build.partitions = no_ota.csv
monitor_speed = 115200
lib_deps =
    mikalhart/TinyGPSPlus@^1.0.3
    bblanchon/ArduinoJson@^6.21.5
